stages: [lint, test, deploy]

variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "/certs/client"

shellcheck:
  stage: lint
  image: koalaman/shellcheck-alpine:stable
  script:
    - shellcheck gen-certs.sh tests/*.sh

compose-config:
  stage: lint
  image: docker:27
  script:
    - cp .env.example .env
    - docker compose config -q

gitleaks:
  stage: lint
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  script:
    - gitleaks git --redact --verbose .

smoke:
  stage: test
  image: docker:27
  services:
    - docker:27-dind
  variables:
    TARGET_HOST: docker
    BIND_ADDR: "0.0.0.0"
  before_script:
    - apk add --no-cache bash curl openssl
  script:
    - cp .env.example .env
    - ./gen-certs.sh
    - docker compose up -d --build --wait --wait-timeout 120
    - docker compose exec -T nginx nginx -t
    - ./tests/smoke.sh
  after_script:
    - docker compose logs --no-color > compose.log || true
    - docker compose down -v || true
  artifacts:
    when: always
    paths: [compose.log]
    expire_in: 1 week

deploy:
  stage: deploy
  image: alpine:3.20
  needs: [smoke]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DEPLOY_HOST
      when: manual
  environment:
    name: staging
  before_script:
    - apk add --no-cache openssh-client rsync
    - install -m 700 -d ~/.ssh
    - cp "$DEPLOY_SSH_KEY" ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - cp "$DEPLOY_KNOWN_HOSTS" ~/.ssh/known_hosts
  script:
    - rsync -az --delete --exclude .git --exclude .env --exclude nginx/certs/ ./ "$DEPLOY_USER@$DEPLOY_HOST:/opt/local-web-stack/"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" 'cd /opt/local-web-stack && docker compose up -d --wait --remove-orphans'

