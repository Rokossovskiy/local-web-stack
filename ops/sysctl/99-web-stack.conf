# Параметры Linux-хоста для стенда. Применение:
#   sudo cp ops/sysctl/99-web-stack.conf /etc/sysctl.d/ && sudo sysctl --system
# Значения стартовые: в проде их подбирают по результатам нагрузочного теста.

# Redis: fork для BGSAVE не падает при нехватке памяти (убирает WARNING в логах)
vm.overcommit_memory = 1

# Очереди входящих соединений
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 8192
net.core.netdev_max_backlog = 16384

# Исходящие соединения nginx -> upstream
net.ipv4.ip_local_port_range = 10240 65535
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15

# Keepalive-соединения не сбрасывают окно перегрузки после простоя
net.ipv4.tcp_slow_start_after_idle = 0

# Лимит файловых дескрипторов на уровне системы
fs.file-max = 2097152

