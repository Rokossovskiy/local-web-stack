# Файл подключается в http-контекст через conf.d: директивы уровня main (worker_*) здесь недоступны.
# Лимит дескрипторов задаётся через ulimits в compose, nginx наследует его.

# На уровне http, чтобы версия скрывалась и на порту 80
server_tokens off;

# 10 req/s на IP; binary_remote_addr экономнее строки: 10 МБ хватает примерно на 160 тыс. IP
limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;
limit_req_status 429;

upstream backend {
    server backend:8080;
    keepalive 16;
}

# HTTP: только healthcheck и редирект на HTTPS
server {
    listen 80;
    server_name _;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl backlog=4096;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;
    # Без тикетов не нужна ротация ключей шифрования сессий
    ssl_session_tickets off;

    client_max_body_size 10m;

    # Заголовки наследуются в location, пока там нет своих add_header.
    # HSTS короткий: на localhost длинный max-age залипнет в браузере для всех портов. В проде 31536000.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        # burst сглаживает всплески, nodelay не задерживает запросы внутри burst
        limit_req zone=per_ip burst=20 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Nginx — edge-прокси, поэтому XFF перезаписываю, а не дополняю: клиент не подделает IP
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}

